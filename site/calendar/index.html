<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeKalb County, Illinois Community Sustainability Calendar</title>
  <meta name="description" content="Community sustainability events across DeKalb County and northern Illinois — repair cafés, native plants, energy, food, cleanups and more.">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="../css/calendar.css">
</head>
<body class="cal">
  <a class="skip" href="#main">Skip to main content</a>
  <div id="notice" class="notice" role="status" hidden></div>
  <header class="site-header cal-header">
    <div class="wrap cal-head">
      <a class="cal-brand" href="#/">
        <strong id="cal-name">DeKalb County, Illinois Community Sustainability Calendar</strong>
      </a>
      <p class="cal-tagline" id="cal-tagline">Community sustainability events across DeKalb County and northern Illinois.</p>
      <nav class="cal-nav" aria-label="Calendar">
        <a href="#/" data-nav="list">Upcoming</a>
        <a href="#/week" data-nav="week">Week</a>
        <a href="#/month" data-nav="month">Month</a>
        <a href="#/submit" data-nav="submit">Add an event</a>
        <a href="#/subscribe" data-nav="subscribe">Subscribe</a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1"><p class="loading">Loading events…</p></main>
  <footer class="site-footer cal-footer">
    <div class="wrap">
      <p id="owner-note"></p>
      <p><a href="#/about">About this calendar</a> · <a href="#/report">Report a problem</a> · <a id="canopy-link" href="../index.html">Canopy coalition</a></p>
      <p id="cal-contact"></p>
      <p class="muted small" id="data-stamp"></p>
    </div>
  </footer>
  <script src="../js/config.js"></script>
  <script src="../js/canopy-core.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/calendar.js"></script>
</body>
</html>
